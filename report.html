<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatCare Help Center - Report a Problem</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <a href="home.html">Home</a>
        <a href="faq.html">FAQ</a>
        <a href="guide.html">Guide</a>
        <a href="contact.html">Support</a>
        <a href="report.html">Report</a>
        <a href="about.html">About</a>
    </nav>

    <div class="container">

        <h1>⚠️ Report a Problem</h1>

        <p>
            Please let us know about any problems you experienced while using our website.
        </p>

        <form>

            <label for="issue"><strong>Problem Type</strong></label>
            <select id="issue">
                <option>Login Issue</option>
                <option>Website Bug</option>
                <option>Account Problem</option>
                <option>Cat Care Information Error</option>
                <option>Other</option>
            </select>

            <label for="details"><strong>Problem Description</strong></label>
            <textarea id="details" rows="6" placeholder="Describe your problem..."></textarea>

            <button type="submit">Submit Report</button>

        </form>

    </div>

</body>
</html>
